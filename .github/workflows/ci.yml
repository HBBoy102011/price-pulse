name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Lint with ruff
        run: ruff check .

      - name: Check formatting with black
        run: black --check .

      - name: Run tests
        run: pytest -q --cov=app --cov-report=term-missing
        env:
          SCHEDULER_ENABLED: "false"
          ROBOTS_CHECK_ENABLED: "false"
          TELEGRAM_ENABLED: "false"
          TELEGRAM_BOT_POLLING: "false"

  postgres:
    name: PostgreSQL integration
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: pricepulse
          POSTGRES_PASSWORD: pricepulse
          POSTGRES_DB: pricepulse
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pricepulse -d pricepulse"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run tests against PostgreSQL
        run: pytest -q
        env:
          TEST_DATABASE_URL: postgresql+psycopg://pricepulse:pricepulse@localhost:5432/pricepulse
          SCHEDULER_ENABLED: "false"
          ROBOTS_CHECK_ENABLED: "false"
          TELEGRAM_ENABLED: "false"
          TELEGRAM_BOT_POLLING: "false"

  migrations:
    name: Alembic migrations
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Apply migrations and check for drift
        run: |
          alembic upgrade head
          alembic check
        env:
          DATABASE_URL: sqlite:///./ci-migrations.db
          AUTO_CREATE_TABLES: "false"
