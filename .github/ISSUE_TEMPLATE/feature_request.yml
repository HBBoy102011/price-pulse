name: ✨ Feature request
description: Предложить улучшение или новую возможность
title: "[feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Опишите задачу, а не только решение: так проще подобрать лучший способ реализации.

  - type: textarea
    id: problem
    attributes:
      label: Какую проблему решает
      description: Что сейчас неудобно или невозможно?
      placeholder: "Хочу сравнивать цену одного товара в нескольких магазинах"
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Предлагаемое решение
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Альтернативы
      description: Какие ещё варианты вы рассматривали?
    validations:
      required: false

  - type: dropdown
    id: area
    attributes:
      label: Область
      options:
        - Парсеры и новые магазины
        - Уведомления и каналы
        - Дашборд и UX
        - Telegram-бот
        - API и авторизация
        - Инфраструктура и качество
        - Другое
    validations:
      required: true

  - type: dropdown
    id: scope
    attributes:
      label: Масштаб
      options:
        - Маленькое улучшение
        - Средняя фича
        - Большая фича / архитектурное изменение
    validations:
      required: true

  - type: textarea
    id: extra
    attributes:
      label: Дополнительный контекст
      description: Ссылки, скриншоты, примеры из других проектов.
    validations:
      required: false

  - type: checkboxes
    id: checks
    attributes:
      label: Проверки
      options:
        - label: Я поискал похожие предложения в issues
          required: true
        - label: Я готов помочь с реализацией (необязательно)
          required: false
