# Render Blueprint: one-click demo with PostgreSQL.
# https://render.com/docs/blueprint-spec
services:
  - type: web
    name: pricepulse
    runtime: docker
    plan: free
    region: frankfurt
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: pricepulse-db
          property: connectionString
      - key: AUTO_CREATE_TABLES
        value: "false"
      - key: SCHEDULER_ENABLED
        value: "true"
      - key: CHECK_INTERVAL_HOURS
        value: "6"
      - key: TELEGRAM_BOT_POLLING
        value: "true"
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_CHAT_ID
        sync: false
      - key: TELEGRAM_ALLOWED_USER_IDS
        sync: false
      - key: CORS_ORIGINS
        value: "*"

databases:
  - name: pricepulse-db
    plan: free
    databaseName: pricepulse
    user: pricepulse
